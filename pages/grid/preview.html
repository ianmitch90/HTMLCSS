<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Responsive Grid composition — viewport specimen</title>
  <!-- This is a genuine independent document. Its @media rules respond to the
       iframe's CSS viewport, not to a parent div or a decorative device shell. -->
  <link rel="stylesheet" href="../../styles/grid-preview.css">
</head>
<body>
  <main class="specimen">
    <header class="specimen-heading">
      <p>GRID / A COMPOSITION</p>
      <p class="specimen-counter">NINE FIELDS · ONE RELATIONSHIP</p>
    </header>
    <div class="specimen-grid" role="img" aria-label="Nine interlocking colored rectangular areas, rearranged by responsive CSS Grid rules.">
      <span class="specimen-tile tile-1"></span>
      <span class="specimen-tile tile-2"></span>
      <span class="specimen-tile tile-3"></span>
      <span class="specimen-tile tile-4"></span>
      <span class="specimen-tile tile-5"></span>
      <span class="specimen-tile tile-6"></span>
      <span class="specimen-tile tile-7"></span>
      <span class="specimen-tile tile-8"></span>
      <span class="specimen-tile tile-9"></span>
    </div>
    <footer class="specimen-footer">HTML + CSS · NO IMAGES <span>RESIZE THE VIEWPORT TO RECOMPOSE</span></footer>
  </main>
</body>
</html>
